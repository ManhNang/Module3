<!doctype html>
<html lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container mt-5">
      <div class="author-section">
        <div class="flex-container">
          <div class="author-avatar"></div>
          <div class="author-details">
            <h5 style="margin: 0">Jane Doe</h5>
            <small>Published on Oct 25, 2026</small>
          </div>
        </div>

        <div class="share-buttons">
          <button>Share Facebook</button>
          <button>Tweet</button>
        </div>
      </div>

      <div class="mosaic-gallery">
        <div class="photo-main">Main Photo</div>
        <div class="photo-sub-1">Sub Photo 1</div>
        <div class="photo-sub-2">Sub Photo 2</div>
      </div>

      <p>
        Đây là nội dung bài báo. Nếu Gallery ở trên co bóp trên mobile, đoạn
        text này sẽ bị đè lên một cách thảm họa do absolute positioning...
      </p>

      <h3 class="mt-4 mb-3">Recommended Articles</h3>
      <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100 p-3 bg-light border">Article 1</div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100 p-3 bg-light border">Article 2</div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100 p-3 bg-light border">Article 3</div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100 p-3 bg-light border">Article 4</div>
        </div>
      </div>
    </div>
  </body>
</html>
